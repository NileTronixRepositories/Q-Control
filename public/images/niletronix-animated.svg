<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-labelledby="niletronixTitle">
  <title id="niletronixTitle">Niletronix</title>
  <defs>
    <clipPath id="nileRevealClip">
      <circle cx="210" cy="48" r="0">
        <animate attributeName="r" values="0;2;34;230" keyTimes="0;0.18;0.42;1" dur="2.1s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1;0.16 1 0.3 1;0.16 1 0.3 1" />
      </circle>
    </clipPath>
    <filter id="softGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0.8 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="textGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b8fbd" />
      <stop offset="1" stop-color="#166aa1" />
    </linearGradient>
  </defs>

  <style>
    .core {
      fill: #12a9ba;
      filter: url(#softGlow);
      opacity: 0;
      transform-origin: 210px 48px;
      animation: corePulse 2.1s cubic-bezier(.16,1,.3,1) 0s 1 both;
    }

    .logo-wrap {
      clip-path: url(#nileRevealClip);
      transform-origin: 210px 48px;
      animation: logoSettle 2.1s cubic-bezier(.16,1,.3,1) 0s 1 both;
    }

    .mark-line {
      fill: none;
      stroke-linejoin: miter;
      stroke-width: 8;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: drawMark 1.25s cubic-bezier(.16,1,.3,1) .38s 1 forwards;
    }

    .mark-fill {
      opacity: 0;
      animation: fillMark .55s ease-out 1.25s 1 forwards;
    }

    .brand-text {
      fill: url(#textGradient);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 31px;
      font-weight: 800;
      letter-spacing: .5px;
      opacity: 0;
      transform: translateX(-14px);
      animation: textIn .75s cubic-bezier(.16,1,.3,1) 1.05s 1 forwards;
    }

    .spark {
      fill: #fff;
      opacity: 0;
      transform-origin: center;
      animation: sparkSweep 1.1s ease-out 1.2s 1 both;
    }

    @keyframes corePulse {
      0% { opacity: 0; transform: scale(.2); }
      12% { opacity: 1; transform: scale(1); }
      42% { opacity: .95; transform: scale(2.35); }
      100% { opacity: 0; transform: scale(36); }
    }

    @keyframes logoSettle {
      0% { opacity: 0; transform: scale(.14) rotate(-8deg); }
      34% { opacity: 1; transform: scale(.58) rotate(0deg); }
      72% { opacity: 1; transform: scale(1.03) rotate(0deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes drawMark { to { stroke-dashoffset: 0; } }
    @keyframes fillMark { to { opacity: 1; } }

    @keyframes textIn {
      0% { opacity: 0; transform: translateX(-14px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes sparkSweep {
      0% { opacity: 0; transform: translateX(-76px) scaleX(.15); }
      34% { opacity: .9; }
      100% { opacity: 0; transform: translateX(150px) scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .core,
      .logo-wrap,
      .mark-line,
      .mark-fill,
      .brand-text,
      .spark {
        animation: none;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }

      .core,
      .spark {
        opacity: 0;
      }
    }
  </style>

  <circle class="core" cx="210" cy="48" r="1.6" />

  <g class="logo-wrap">
    <g transform="translate(28 16)">
      <path class="mark-fill" fill="#0d8fbd" d="M0 2h17l32 18v14L13 14v42H0z" />
      <path class="mark-fill" fill="#ec2330" d="M51 0h17v64H51L19 46V32l32 18z" />
      <path class="mark-line" stroke="#16a4c9" d="M8 58V8h9l38 21" />
      <path class="mark-line" stroke="#ec2330" d="M60 6v50h-9L13 35" />
    </g>

    <text class="brand-text" x="112" y="59">NILETRONIX</text>

    <rect class="spark" x="78" y="45" width="190" height="3" rx="1.5" />
  </g>
</svg>