<header class="app-language-header w-100">
  <div class="container-fluid px-0">
    <nav class="navbar navbar-expand app-header-navbar shadow-sm">
      <div class="container-fluid px-3 py-2">
        <div
          class="navbar-brand d-flex align-items-center gap-2 m-0 text-truncate"
          aria-label="Q-Control"
        >
          <span class="brand-mark" aria-hidden="true">
            <img [src]="logoSrc()" alt="" class="brand-icon" />
          </span>
          <!-- <span class="brand-copy d-flex flex-column text-truncate">
            <span class="brand-name text-truncate">{{ brandName() }}</span>
            <span class="brand-subtitle text-truncate">{{ brandSubtitle() }}</span>
          </span> -->
        </div>

        <div class="btn-group language-switcher" role="group" [attr.aria-label]="languageLabel()">
          <button
            type="button"
            class="btn btn-sm language-button"
            [class.active]="language() === 'ar'"
            [attr.aria-label]="arabicLabel()"
            [attr.title]="arabicLabel()"
            [attr.aria-pressed]="language() === 'ar'"
            (click)="selectLanguage('ar')"
          >
            <svg
              class="language-icon bi"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M4.545 6.714 4.11 8H3l1.862-5h1.284L8 8H6.833l-.435-1.286zm1.634-.736L5.5 3.956h-.049l-.679 2.022z" />
              <path d="M0 2a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v3h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm7.138 9.995q.285.451.63.846c-.748.575-1.673 1.001-2.768 1.292.178.217.451.635.555.867 1.125-.359 2.08-.844 2.886-1.494.777.665 1.739 1.165 2.93 1.472.133-.254.414-.673.629-.89-1.125-.253-2.057-.694-2.82-1.284.681-.747 1.222-1.651 1.621-2.757H14V8h-3v1.047h.765c-.318.844-.74 1.546-1.272 2.13a6 6 0 0 1-.415-.492 2 2 0 0 1-.94.31" />
            </svg>
            <span class="language-text">{{ arabicLabel() }}</span>
          </button>
          <button
            type="button"
            class="btn btn-sm language-button"
            [class.active]="language() === 'en'"
            [attr.aria-label]="englishLabel()"
            [attr.title]="englishLabel()"
            [attr.aria-pressed]="language() === 'en'"
            (click)="selectLanguage('en')"
          >
            <svg
              class="language-icon bi"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855A8 8 0 0 0 5.145 4H7.5zM4.09 4a9.3 9.3 0 0 1 .64-1.539 7 7 0 0 1 .597-.933A7.03 7.03 0 0 0 2.255 4zm-.582 3.5c.03-.877.138-1.718.312-2.5H1.674a7 7 0 0 0-.656 2.5zM4.847 5a12.5 12.5 0 0 0-.338 2.5H7.5V5zM8.5 5v2.5h2.99a12.5 12.5 0 0 0-.337-2.5zM4.51 8.5a12.5 12.5 0 0 0 .337 2.5H7.5V8.5zm3.99 0V11h2.653c.187-.765.306-1.608.338-2.5zM5.145 12q.208.58.468 1.068c.552 1.035 1.218 1.65 1.887 1.855V12zm.182 2.472a7 7 0 0 1-.597-.933A9.3 9.3 0 0 1 4.09 12H2.255a7 7 0 0 0 3.072 2.472M3.82 11a13.7 13.7 0 0 1-.312-2.5h-2.49c.062.89.291 1.733.656 2.5zm6.853 3.472A7 7 0 0 0 13.745 12H11.91a9.3 9.3 0 0 1-.64 1.539 7 7 0 0 1-.597.933M8.5 12v2.923c.67-.204 1.335-.82 1.887-1.855q.26-.487.468-1.068zm3.68-1h2.146c.365-.767.594-1.61.656-2.5h-2.49a13.7 13.7 0 0 1-.312 2.5m2.802-3.5a7 7 0 0 0-.656-2.5H12.18c.174.782.282 1.623.312 2.5zM11.27 2.461c.247.464.462.98.64 1.539h1.835a7 7 0 0 0-3.072-2.472c.218.284.418.598.597.933M10.855 4a8 8 0 0 0-.468-1.068C9.835 1.897 9.17 1.282 8.5 1.077V4z" />
            </svg>
            <span class="language-text">{{ englishLabel() }}</span>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
