<article data-testid="technical-admin-mobile-record-card" class="technical-admin-mobile-record-card overflow-hidden border bg-white shadow-sm">
  <header class="record-card-header d-flex align-items-start gap-3">
    <span class="record-card-icon d-grid flex-shrink-0">
      <i [class]="icon()" aria-hidden="true"></i>
    </span>
    <div class="record-card-main flex-grow-1">
      <div class="d-flex flex-wrap align-items-start justify-content-between gap-2">
        <div class="record-card-title flex-grow-1">
          @if (eyebrow()) {
            <p class="record-card-eyebrow mb-1 text-uppercase">{{ eyebrow() }}</p>
          }
          <h3 class="record-card-heading m-0 text-break">{{ title() }}</h3>
        </div>
        @if (recordId() !== null) {
          <strong class="record-card-id flex-shrink-0">{{ recordId() }}</strong>
        }
      </div>
      <div class="record-card-badges d-flex flex-wrap gap-1 mt-2">
        <ng-content select="[record-badges]" />
      </div>
    </div>
  </header>

  <dl class="record-card-fields m-0 d-grid">
    <ng-content select="[record-fields]" />
  </dl>

  <footer class="record-card-actions d-flex flex-wrap align-items-stretch gap-2">
    <ng-content select="[record-actions]" />
  </footer>
</article>
