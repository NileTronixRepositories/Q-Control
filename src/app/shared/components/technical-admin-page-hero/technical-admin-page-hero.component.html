<header class="relative flex min-h-0 items-center overflow-hidden rounded-2xl border border-cyan-100 bg-gradient-to-br from-white via-cyan-50/50 to-sky-100/70 p-3 shadow-[0_16px_40px_-24px_rgba(8,145,178,0.45)] sm:min-h-28 sm:rounded-3xl sm:p-5">
  <div class="pointer-events-none absolute -end-14 -top-16 size-48 rounded-full bg-cyan-300/25 blur-3xl"></div>
  <div class="pointer-events-none absolute bottom-0 end-28 hidden h-20 w-32 bg-[radial-gradient(circle,rgba(14,116,144,0.18)_1.5px,transparent_1.5px)] bg-[length:12px_12px] sm:block"></div>

  <div class="relative flex min-w-0 w-full flex-col gap-3 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
    <div class="flex min-w-0 items-start gap-2.5 sm:items-center sm:gap-4">
      <span class="grid size-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-cyan-600 to-sky-800 text-lg text-white shadow-lg shadow-cyan-800/20 sm:size-14 sm:rounded-2xl sm:text-2xl">
        <i [class]="icon()" aria-hidden="true"></i>
      </span>
      <div class="min-w-0">
        <p class="mb-1 text-xs font-black uppercase tracking-wide text-cyan-700">{{ eyebrow() }}</p>
        <h1 class="m-0 break-words text-xl font-black leading-[1.3] text-slate-950 min-[400px]:text-2xl sm:text-3xl">{{ title() }}</h1>
        @if (description()) {
          <p class="mb-0 mt-1.5 max-w-3xl break-words text-xs leading-relaxed text-slate-600 sm:text-sm">{{ description() }}</p>
        }
      </div>
    </div>

    <div class="flex w-full min-w-0 flex-wrap items-stretch gap-2 [&>*]:w-full sm:w-auto sm:shrink-0 sm:items-center sm:justify-end sm:[&>*]:w-auto">
      <ng-content select="[hero-actions]" />
    </div>
  </div>
</header>
