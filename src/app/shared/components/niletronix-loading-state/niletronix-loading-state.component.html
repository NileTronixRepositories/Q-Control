<section [class]="classList()" role="status" aria-live="polite" aria-atomic="true">
  @if (variant() === 'skeleton') {
    <div class="nt-skeleton-wrapper" aria-hidden="true">
      <div class="skeleton-shimmer nt-skeleton-line" style="width: 75%;"></div>
      <div class="skeleton-shimmer nt-skeleton-line" style="width: 50%;"></div>
      <div class="skeleton-shimmer nt-skeleton-line" style="width: 85%;"></div>
      <div class="skeleton-shimmer nt-skeleton-line" style="width: 40%;"></div>
    </div>
  } @else {
    <span class="nt-loading-orb" aria-hidden="true">
      <span class="nt-loading-ring"></span>
      <i [class]="icon()"></i>
    </span>
    <span class="nt-loading-copy">
      <strong>{{ title() }}</strong>
      @if (description()) {
        <small>{{ description() }}</small>
      }
    </span>
    <span class="nt-loading-bar" aria-hidden="true"></span>
  }
</section>
