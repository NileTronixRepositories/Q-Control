<header class="page-header d-flex flex-column mb-4 hero-header">
  <!-- Header Top Row (Title & Actions) -->
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 w-100">
    <div class="d-flex align-items-center gap-4">
      <span
        class="d-flex align-items-center flex-shrink-0 justify-content-center text-white rounded-4 shadow-sm hero-icon-container"
      >
        <i [class]="icon()" aria-hidden="true"></i>
      </span>
      <div>
        @if (eyebrow()) {
          <!-- <div class="eyebrow text-primary mb-1 fw-bold small text-uppercase hero-eyebrow">{{ eyebrow() }}</div> -->
        }
        <h1 class="page-title mb-1 m-0 fw-black text-dark hero-title">{{ title() }}</h1>
        @if (description()) {
          <!-- <p class="header-description mb-0 text-muted small hero-description">{{ description() }}</p> -->
        }
      </div>
    </div>

    <div class="header-actions">
      <ng-content select="[hero-actions]" />
    </div>
  </div>

  <!-- Header Bottom Row (Filters) -->
  <div class="header-filters w-100">
    <ng-content select="[hero-filters]" />
  </div>
</header>
