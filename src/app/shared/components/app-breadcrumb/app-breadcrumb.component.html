@if (items().length > 0) {
  <nav
    class="app-breadcrumb"
    [attr.aria-label]="ariaLabel()"
    [attr.dir]="direction()"
    [attr.lang]="language()"
  >
    <ol class="app-breadcrumb-list">
      @for (item of items(); track item.route ?? item.label; let index = $index) {
        <li class="app-breadcrumb-item" [class.is-current]="isLast(index)">
          @if (isLast(index)) {
            <span class="app-breadcrumb-current" aria-current="page">
              @if (item.icon) {
                <i class="bi {{ item.icon }}" aria-hidden="true"></i>
              }
              <span>{{ item.label }}</span>
            </span>
          } @else if (item.route) {
            <a class="app-breadcrumb-link" [routerLink]="item.route">
              @if (item.icon) {
                <i class="bi {{ item.icon }}" aria-hidden="true"></i>
              }
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <span class="app-breadcrumb-label">
              @if (item.icon) {
                <i class="bi {{ item.icon }}" aria-hidden="true"></i>
              }
              <span>{{ item.label }}</span>
            </span>
          }
        </li>
      }
    </ol>
  </nav>
}
