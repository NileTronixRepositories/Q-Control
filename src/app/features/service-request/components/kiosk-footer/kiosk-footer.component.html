<footer
  class="kiosk-footer"
  [style.background]="store.footerButton()?.backgroundColor || store.theme()?.footerColor || null"
  [style.color]="store.footerButton()?.textColor || null"
>
  <span class="kiosk-footer__wave kiosk-footer__wave--left" aria-hidden="true"></span>
  <span class="kiosk-footer__wave kiosk-footer__wave--right" aria-hidden="true"></span>

  <strong class="kiosk-footer__caption">
    <!-- <i class="bi bi-hand-index-thumb kiosk-footer__icon" aria-hidden="true"></i> -->
    <span>{{ store.footerButton()?.text || caption() }}</span>
  </strong>
</footer>
