<button type="button" [class]="cardClass()" (click)="selectCard()">
  <div class="service-card__header">
    <span class="service-card__icon">
      @if (card().imageUrl) {
        <img [src]="card().imageUrl" alt="" class="service-card__img" />
      } @else {
        <i class="bi {{ card().icon }}" aria-hidden="true"></i>
      }
    </span>

    @if (card().meta) {
      <span class="service-card__meta">
        <i class="bi bi-clock" aria-hidden="true"></i>
        <span>{{ card().meta }}</span>
      </span>
    }
  </div>

  <div class="service-card__body">
    <span class="service-card__title">
      {{ card().title }}
    </span>

    @if (card().description) {
      <span class="service-card__description">
        {{ card().description }}
      </span>
    }
  </div>

  <div class="service-card__footer">
    <span class="service-card__prompt">{{ promptText() }}</span>
    <i class="bi {{ arrowIconClass() }} service-card__arrow" aria-hidden="true"></i>
  </div>
</button>
