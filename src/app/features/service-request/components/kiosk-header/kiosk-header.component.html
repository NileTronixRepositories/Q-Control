<header class="kiosk-header">
  <div class="kiosk-header__brand-container d-flex align-items-center gap-3">
    <div class="kiosk-header__brand" aria-label="Application logo">
      @if (logoUrl(); as imgUrl) {
        <img src="/images/service-request/logo-qcontrol.png" class="kiosk-header__logo" />
      } @else {
        <span class="kiosk-header__mark"> Q </span>
      }
    </div>

    @if (showNavigationPath() && stepItems().length > 0) {
      <nav class="service-request-navigation-path d-flex align-items-center gap-2 ms-3" aria-label="Breadcrumb">
        @for (item of stepItems(); track item.id; let last = $last) {
          <span
            class="nav-path-step badge px-3 py-2 fs-6 fw-bold"
            [class.nav-path-step--last]="last"
            [class.bg-light]="!last"
            [class.text-dark]="!last"
          >
            {{ item.label }}
          </span>
          @if (!last) {
            <i
              class="bi nav-path-arrow"
              [class.bi-chevron-left]="isRtl()"
              [class.bi-chevron-right]="!isRtl()"
              aria-hidden="true"
            ></i>
          }
        }
      </nav>
    }
  </div>

  <div class="kiosk-header__end d-flex align-items-center gap-3 justify-content-end">
    <div class="kiosk-header__niletronix" aria-label="NileTronix">
      <img src="/images/nile.png" alt="NileTronix" class="kiosk-header__nile-logo" />
    </div>
  </div>
</header>
