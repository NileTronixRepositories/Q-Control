<main
  class="initial-password-shell min-vh-100"
  [attr.dir]="i18nStore.direction()"
  [attr.lang]="i18nStore.language()"
>
  <app-language-header
    [language]="i18nStore.language()"
    [brandName]="translations().brandName"
    [brandSubtitle]="translations().brandSubtitle"
    [languageLabel]="translations().languageLabel"
    [arabicLabel]="translations().arabicLanguage"
    [englishLabel]="translations().englishLanguage"
    (languageChange)="i18nStore.setLanguage($event)"
  />

  <section class="initial-password-stage" aria-labelledby="initial-password-title">
    <div class="initial-password-card">
      <header class="initial-password-header">
        <p class="eyebrow">{{ copy().eyebrow }}</p>
        <h1 id="initial-password-title">{{ copy().title }}</h1>
        <p>{{ copy().description }}</p>
      </header>

      @if (formMessage()) {
        <div
          class="initial-password-message"
          [class.initial-password-message-success]="status() === 'success'"
          [class.initial-password-message-error]="status() === 'error'"
          role="status"
          aria-live="polite"
        >
          {{ formMessage() }}
        </div>
      }

      <form
        class="initial-password-form"
        [formGroup]="passwordForm"
        [attr.aria-busy]="isSubmitting()"
        (ngSubmit)="submitPassword()"
        novalidate
      >
        <label class="field-group" for="new-password">
          <span class="form-label required-field">{{ copy().newPasswordLabel }}</span>
          <span class="input-shell password-shell" [class.input-invalid]="hasNewPasswordError()">
            <i class="bi bi-key" aria-hidden="true"></i>
            <input
              id="new-password"
              class="form-control"
              [class.is-invalid]="hasNewPasswordError()"
              [type]="newPasswordVisible() ? 'text' : 'password'"
              formControlName="newPassword"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="
                newPasswordVisible()
                  ? translations().hidePasswordLabel
                  : translations().showPasswordLabel
              "
              (click)="toggleNewPasswordVisibility()"
            >
              <i
                class="bi"
                [class.bi-eye-slash]="newPasswordVisible()"
                [class.bi-eye]="!newPasswordVisible()"
                aria-hidden="true"
              ></i>
            </button>
          </span>
          @if (newPasswordErrorMessage()) {
            <small class="invalid-feedback d-block">{{ newPasswordErrorMessage() }}</small>
          }
        </label>

        <label class="field-group" for="confirm-new-password">
          <span class="form-label required-field">{{ copy().confirmPasswordLabel }}</span>
          <span class="input-shell password-shell" [class.input-invalid]="hasConfirmPasswordError()">
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
            <input
              id="confirm-new-password"
              class="form-control"
              [class.is-invalid]="hasConfirmPasswordError()"
              [type]="confirmPasswordVisible() ? 'text' : 'password'"
              formControlName="confirmNewPassword"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="
                confirmPasswordVisible()
                  ? translations().hidePasswordLabel
                  : translations().showPasswordLabel
              "
              (click)="toggleConfirmPasswordVisibility()"
            >
              <i
                class="bi"
                [class.bi-eye-slash]="confirmPasswordVisible()"
                [class.bi-eye]="!confirmPasswordVisible()"
                aria-hidden="true"
              ></i>
            </button>
          </span>
          @if (confirmPasswordErrorMessage()) {
            <small class="invalid-feedback d-block">{{ confirmPasswordErrorMessage() }}</small>
          }
        </label>

        <div class="initial-password-actions">
          <button type="button" class="secondary-button" (click)="logout()">
            <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
            <span>{{ copy().logout }}</span>
          </button>
          <button type="submit" class="submit-button" [disabled]="isSubmitting()">
            @if (isSubmitting()) {
              <span class="button-spinner" aria-hidden="true"></span>
              <span>{{ copy().submitting }}</span>
            } @else {
              <i class="bi bi-check2-circle" aria-hidden="true"></i>
              <span>{{ copy().submit }}</span>
            }
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
