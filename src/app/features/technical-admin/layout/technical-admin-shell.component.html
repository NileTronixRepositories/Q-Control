  [direction]="i18nStore.direction()"
  [language]="i18nStore.language()"

  [openSidebarLabel]="translations().openSidebarLabel"
  [navigationLabel]="translations().navigationLabel"
  [accountActionsLabel]="translations().accountActionsLabel"
  [topbarEyebrow]="translations().topbarEyebrow"
