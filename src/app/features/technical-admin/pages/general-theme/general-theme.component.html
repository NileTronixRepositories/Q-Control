<section class="technical-page container py-3 py-md-4">
  <header
    class="page-header d-flex flex-column flex-md-row align-items-start justify-content-between gap-3"
  >
    <div>
      <p class="eyebrow mb-2">
        {{ translations().themeConfigurationLabel }}
      </p>

      <h1 class="mb-2">
        {{ translations().generalLabel }}
      </h1>

      <span class="header-description">
        {{ translations().generalDescription }}
      </span>
    </div>

    @if (saved()) {
      <p class="save-status mb-0" role="status">
        <i class="bi bi-check-circle-fill"></i>
        {{ translations().savedSuccessfullyLabel }}
      </p>
    }
  </header>

  <section class="settings-panel mt-4" [attr.aria-label]="translations().generalLabel">
    <form class="theme-form row g-4">
      <!-- Main Color -->
      <div class="col-12 col-lg-6">
        <div class="form-row">
          <label for="mainColor" class="form-label">
            {{ translations().mainLabel }}
          </label>

          <div class="color-control">
            <input
              id="mainColor"
              type="text"
              class="form-control border-0"
              [value]="configuration().mainColor"
              (input)="updateMainColor($event)"
            />

            <span class="color-preview" [style.background]="configuration().mainColor"></span>
          </div>
        </div>
      </div>

      <!-- Secondary Color -->
      <div class="col-12 col-lg-6">
        <div class="form-row">
          <label for="secondaryColor" class="form-label">
            {{ translations().secondaryLabel }}
          </label>

          <div class="color-control">
            <input
              id="secondaryColor"
              type="text"
              class="form-control border-0"
              [value]="configuration().secondaryColor"
              (input)="updateSecondaryColor($event)"
            />

            <span class="color-preview" [style.background]="configuration().secondaryColor"></span>
          </div>
        </div>
      </div>

      <!-- Background Color -->
      <div class="col-12 col-lg-6">
        <div class="form-row">
          <label for="backgroundColor" class="form-label">
            {{ translations().backgroundLabel }}
          </label>

          <div class="color-control">
            <input
              id="backgroundColor"
              type="text"
              class="form-control border-0"
              [value]="configuration().backgroundColor"
              (input)="updateBackgroundColor($event)"
            />

            <span class="color-preview" [style.background]="configuration().backgroundColor"></span>
          </div>
        </div>
      </div>

      <!-- Upload -->
      <div class="col-12 col-lg-6">
        <div class="form-row">
          <label for="advertisementImages" class="form-label">
            {{ translations().advertisementLabel }}
          </label>

          <label class="upload-control w-100" for="advertisementImages">
            <i class="bi bi-images"></i>

            <span>
              {{ advertisementLabel() }}
            </span>
          </label>

          <input
            id="advertisementImages"
            class="visually-hidden-input"
            type="file"
            accept="image/*"
            multiple
            (change)="addAdvertisementImages($event)"
          />
        </div>
      </div>
    </form>

    <div class="panel-actions d-flex justify-content-end mt-4 pt-4">
      <button type="button" class="btn primary-action" (click)="save()">
        <i class="bi bi-check-lg"></i>

        {{ translations().saveGeneralThemeLabel }}
      </button>
    </div>
  </section>
</section>
