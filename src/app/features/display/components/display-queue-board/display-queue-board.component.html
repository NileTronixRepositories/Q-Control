<div class="queue-table-wrapper" [class.rtl-mode]="isAr()">
  <table class="tv-queue-table">
    <thead>
      <tr
        class="table-header-row"
        [style.backgroundColor]="tableHeaderBgColor()"
        [style.color]="tableHeaderTextColor()"
      >
        <th class="th-clinic">{{ windowColumnTitle() }}</th>
        <th class="th-doctor-service">{{ serviceColumnTitle() }}</th>
        <th class="th-ticket">{{ ticketColumnTitle() }}</th>
      </tr>
    </thead>
    <tbody>
      @for (item of queueItems(); track item.windowId) {
        <tr
          class="table-data-row"
          [class.calling-row]="item.isFlashing || item.status === 'calling'"
          [style.backgroundColor]="tableRowBgColor()"
          [style.color]="tableRowTextColor()"
        >
          <td class="td-clinic">
            <span class="clinic-title">{{ getWindowName(item) }}</span>
          </td>
          <td class="td-doctor-service">
            <span class="doctor-service-text">{{ getDoctorAndService(item) }}</span>
          </td>
          <td class="td-ticket">
            <div
              class="ticket-badge-tv"
              [class.pulse-flash]="item.isFlashing"
              [style.backgroundColor]="ticketBadgeBgColor()"
              [style.color]="ticketBadgeTextColor()"
            >
              {{ item.currentTicket || '---' }}
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
