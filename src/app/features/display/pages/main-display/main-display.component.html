<div class="main-display-layout" [class.rtl-mode]="isAr()" [style.backgroundColor]="displayBgColor()">
  <!-- Top Brand Header Bar -->
  <div class="tv-header-strip">
    <app-display-header />
  </div>

  <!-- Main Content Body: Video on Left, Queue Table on Right (Exact Same Level) -->
  <div class="tv-workspace-grid">
    <section class="media-video-column" [attr.aria-label]="translations().mediaPlayerLabel">
      <app-display-media-player />
    </section>

    <section class="queue-table-column" [attr.aria-label]="translations().queueTableLabel">
      <app-display-queue-board />
    </section>
  </div>

  <!-- Bottom: Clock Capsule + Scrolling Ticker -->
  <app-display-ticker-bar />

  <!-- ========================================================
       KIOSK AUTHENTICATION / DISPLAY ACTIVATION MODAL
       ======================================================== -->
  @if (isAuthModalOpen()) {
    <div class="display-auth-backdrop">
      <div class="display-auth-dialog shadow-lg" (click)="$event.stopPropagation()">
        <!-- Header -->
        <div class="display-auth-header text-center pb-3">
          <div class="auth-icon-circle mx-auto mb-3">
            <i class="bi bi-tv-fill text-primary" aria-hidden="true"></i>
          </div>
          <h3 class="auth-title mb-1">
            {{ translations().activationTitle }}
          </h3>
          <p class="auth-subtitle mb-0">
            {{ isAr()
              ? 'يرجى تسجيل الدخول لربط الشاشة بقائمة تشغيل الفرع الحية ومزامنة الطوابير.'
              : 'Please sign in to link this display with live branch video playlists and queue updates.' }}
          </p>
        </div>

        <!-- Error Notice -->
        @if (authError(); as err) {
          <div class="alert-error-box mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-octagon-fill fs-5" aria-hidden="true"></i>
            <span>{{ err }}</span>
          </div>
        }

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="submitDisplayLogin()" class="display-auth-form">
          <!-- Username Field -->
          <div class="auth-field-group mb-3">
            <label for="kioskUsername" class="auth-form-label">
              {{ translations().usernameLabel }}
              <span class="required-mark">*</span>
            </label>
            <div class="input-shell" [class.input-invalid]="loginForm.controls.username.touched && loginForm.controls.username.invalid">
              <i class="bi bi-person-fill" aria-hidden="true"></i>
              <input
                id="kioskUsername"
                type="text"
                class="login-input"
                formControlName="username"
                [placeholder]="translations().usernamePlaceholder"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <!-- Password Field -->
          <div class="auth-field-group mb-4">
            <label for="kioskPassword" class="auth-form-label">
              {{ translations().passwordLabel }}
              <span class="required-mark">*</span>
            </label>
            <div class="input-shell" [class.input-invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid">
              <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
              <input
                id="kioskPassword"
                [type]="passwordVisible() ? 'text' : 'password'"
                class="login-input"
                formControlName="password"
                [placeholder]="translations().passwordPlaceholder"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="passwordVisible() ? translations().hidePasswordLabel : translations().showPasswordLabel"
              >
                <i class="bi" [class.bi-eye-slash-fill]="passwordVisible()" [class.bi-eye-fill]="!passwordVisible()" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn-activate d-flex align-items-center justify-content-center gap-2"
              [disabled]="isSubmitting() || loginForm.invalid"
            >
              @if (isSubmitting()) {
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span>{{ translations().activatingLabel }}</span>
              } @else {
                <i class="bi bi-box-arrow-in-right fs-5" aria-hidden="true"></i>
                <span>{{ translations().activateLabel }}</span>
              }
            </button>

            <button
              type="button"
              class="btn-demo d-flex align-items-center justify-content-center gap-2 mt-1"
              (click)="dismissAuthModal()"
            >
              <i class="bi bi-play-circle" aria-hidden="true"></i>
              <span>{{ translations().demoModeLabel }}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
