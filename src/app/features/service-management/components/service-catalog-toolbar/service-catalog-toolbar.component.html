<div class="svc-toolbar bg-body-tertiary p-3 rounded-3 border d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
  <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1">
    <div class="position-relative flex-grow-1" style="max-width: 400px;">
      <input
        type="search"
        class="form-control ps-4"
        [value]="searchText()"
        [placeholder]="searchPlaceholder() || translations().searchPlaceholder"
        (input)="onSearchInput($event)"
      />
      @if (searchText()) {
        <button
          type="button"
          class="btn btn-sm btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted"
          (click)="clearSearch()"
          aria-label="Clear search"
        >
          <i class="bi bi-x-circle-fill"></i>
        </button>
      }
    </div>

    <div class="d-flex align-items-center gap-3">
      <div class="form-check form-switch mb-0">
        <input
          type="checkbox"
          class="form-check-input"
          id="toolbarIncludeInactive"
          [checked]="includeInactive()"
          (change)="onIncludeInactiveChange($event)"
        />
        <label class="form-check-label small fw-medium" for="toolbarIncludeInactive">
          {{ translations().includeInactive }}
        </label>
      </div>

      <div class="form-check form-switch mb-0">
        <input
          type="checkbox"
          class="form-check-input"
          id="toolbarIncludeDeleted"
          [checked]="includeDeleted()"
          (change)="onIncludeDeletedChange($event)"
        />
        <label class="form-check-label small fw-medium text-danger" for="toolbarIncludeDeleted">
          {{ translations().includeDeleted }}
        </label>
      </div>
    </div>
  </div>

  @if (canCreate()) {
    <button
      type="button"
      class="btn btn-primary d-flex align-items-center gap-2"
      (click)="createRoot.emit()"
    >
      <i class="bi bi-plus-lg"></i>
      <span>{{ createRootLabel() || translations().addRootService }}</span>
    </button>
  }
</div>
