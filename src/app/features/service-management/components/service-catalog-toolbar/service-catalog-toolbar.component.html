<div class="svc-toolbar bg-body-tertiary p-3 rounded-3 border d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
  <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1">
    <div class="search-input-wrapper flex-grow-1" style="max-width: 400px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="search"
        class="form-control"
        [value]="searchText()"
        [placeholder]="searchPlaceholder() || translations().searchPlaceholder"
        (input)="onSearchInput($event)"
      />
      @if (searchText()) {
        <button
          type="button"
          class="btn btn-sm btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted"
          (click)="clearSearch()"
          aria-label="Clear search"
        >
          <i class="bi bi-x-circle-fill"></i>
        </button>
      }
    </div>

    <div class="d-flex align-items-center gap-2">
      <div>
        <input
          type="checkbox"
          class="btn-check"
          id="toolbarIncludeInactive"
          [checked]="includeInactive()"
          (change)="onIncludeInactiveChange($event)"
        />
        <label 
          class="filter-chip" 
          [class.active-cyan]="includeInactive()" 
          for="toolbarIncludeInactive"
        >
          {{ translations().includeInactive }}
          <span class="check-icon-wrapper">
            <span class="check-icon-inner">
              <i class="bi bi-check2"></i>
            </span>
          </span>
        </label>
      </div>

      <div>
        <input
          type="checkbox"
          class="btn-check"
          id="toolbarIncludeDeleted"
          [checked]="includeDeleted()"
          (change)="onIncludeDeletedChange($event)"
        />
        <label 
          class="filter-chip" 
          [class.active-cyan]="includeDeleted()" 
          for="toolbarIncludeDeleted"
        >
          {{ translations().includeDeleted }}
          <span class="check-icon-wrapper">
            <span class="check-icon-inner">
              <i class="bi bi-check2"></i>
            </span>
          </span>
        </label>
      </div>
    </div>
  </div>

  @if (canCreate()) {
    <button
      type="button"
      class="btn btn-primary d-flex align-items-center gap-2"
      (click)="createRoot.emit()"
    >
      <i class="bi bi-plus-lg"></i>
      <span>{{ createRootLabel() || translations().addRootService }}</span>
    </button>
  }
</div>
