<div
  class="q-dialog-backdrop"
  role="presentation"
  tabindex="-1"
  (click)="closeFromBackdrop($event)"
>
  <section
    class="q-dialog q-dialog--sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="branch-service-lifecycle-title"
    aria-describedby="branch-service-lifecycle-description"
  >

    <!-- ── Header ── -->
    <header class="q-dialog-header">
      <div class="d-flex align-items-center gap-3">
        <span
          class="q-confirm-icon"
          [class.q-confirm-icon--danger]="isDelete() || isPermanentDelete()"
          [class.q-confirm-icon--success]="!isDelete() && !isPermanentDelete()"
        >
          <i
            class="bi"
            [class.bi-trash3]="isDelete() || isPermanentDelete()"
            [class.bi-arrow-counterclockwise]="!isDelete() && !isPermanentDelete()"
            aria-hidden="true"
          ></i>
        </span>
        <div>
          <h2 id="branch-service-lifecycle-title" class="q-dialog-title mb-0">
            {{ title() }}
          </h2>
          <p class="q-confirm-service-name">{{ state().serviceName }}</p>
        </div>
      </div>
      <button
        type="button"
        class="q-dialog-close"
        [disabled]="mutating()"
        [attr.aria-label]="translations().close"
        (click)="requestClose()"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    <!-- ── Body ── -->
    <div class="q-dialog-body d-grid gap-3">
      <p id="branch-service-lifecycle-description" class="q-confirm-body">
        {{ body() }}
      </p>
      @if (isDelete() && state().hasChildren) {
        <div class="q-alert q-alert--warning" role="alert">
          <i class="bi bi-exclamation-triangle flex-shrink-0" aria-hidden="true"></i>
          <p class="mb-0">{{ translations().lifecycleDeleteParentWarning }}</p>
        </div>
      }
      @if (!isDelete() && !isPermanentDelete()) {
        <div class="q-alert q-alert--info" role="alert">
          <i class="bi bi-info-circle flex-shrink-0" aria-hidden="true"></i>
          <p class="mb-0">{{ translations().lifecycleRestoreOperationalWarning }}</p>
        </div>
      }
    </div>

    <!-- ── Footer ── -->
    <footer class="q-dialog-footer">
      <button
        type="button"
        class="q-btn q-btn--secondary"
        autofocus
        [disabled]="mutating()"
        (click)="requestClose()"
      >
        {{ translations().cancel }}
      </button>
      <button
        type="button"
        [class]="confirmButtonClass()"
        [disabled]="mutating()"
        (click)="requestConfirm()"
      >
        @if (mutating()) {
          <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
          <span>{{ progressLabel() }}</span>
        } @else {
          <span>{{ confirmLabel() }}</span>
        }
      </button>
    </footer>

  </section>
</div>
