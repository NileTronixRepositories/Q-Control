<section
  class="technical-admin-responsive-page container-fluid d-grid gap-3 p-3 p-lg-4 w-100"
  [attr.dir]="direction()"
  [attr.lang]="language()"
>
  <app-technical-admin-page-hero
    [eyebrow]="translations().eyebrow"
    [title]="translations().centralTreeTitle"
    [description]="translations().centralTreeDescription"
    icon="bi bi-diagram-2-fill"
  />
  @if (error()) {
    <p class="rounded-3 border border-danger-subtle bg-danger-subtle p-4 text-danger">
      {{ error() }}
    </p>
  }
  <app-service-hierarchy-tree
    [nodes]="nodes()"
    [expandedNodeIds]="expandedIds()"
    [selectedServiceId]="null"
    [translations]="serviceTranslations()"
    [language]="language()"
    [direction]="direction()"
    [loading]="loading()"
    [includeInactive]="includeInactive()"
    [includeDeleted]="includeDeleted()"
    [canCreate]="false"
    [canViewDetails]="false"
    [canUpdate]="false"
    [canDelete]="false"
    [canRestore]="false"
    (refresh)="loadTree()"
    (includeInactiveChange)="updateFilter('inactive', $event)"
    (includeDeletedChange)="isTechnicalAdmin() && updateFilter('deleted', $event)"
    (toggleNode)="toggleNode($event)"
  />
</section>
