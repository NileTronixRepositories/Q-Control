<app-modal
  [isOpen]="open"
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  [size]="'md'"
  icon="bi bi-tag-fill"
  [direction]="direction"
  [loading]="saving"
  [closeLabel]="translations.close"
  (closed)="closeModal()"
>
  <div modal-body>
    <form id="segmentForm" (ngSubmit)="onSubmit()" class="editor-form">
      @if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 mb-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill fs-6 flex-shrink-0"></i>
          <div class="small fw-semibold">{{ errorMessage() }}</div>
        </div>
      }

      @if (isDefaultSegment) {
        <div class="alert alert-warning d-flex align-items-center gap-2 rounded-3 py-2 px-3 mb-3">
          <i class="bi bi-shield-lock-fill fs-6 flex-shrink-0 text-warning"></i>
          <small class="fw-semibold">{{ translations.priorityFixedHint }}</small>
        </div>
      }

      <div class="d-flex flex-column gap-3">
        <div class="q-field">
          <label class="q-field-label" for="arabicName">
            <span class="q-field-icon-badge q-field-icon-badge--teal">
              <i class="bi bi-translate"></i>
            </span>
            <span>{{ translations.arabicName }}</span>
            <span class="q-field-required">*</span>
          </label>
          <input
            id="arabicName"
            name="arabicName"
            type="text"
            class="form-control"
            maxlength="100"
            required
            [disabled]="isNamesDisabled || saving"
            [ngModel]="arabicName()"
            (ngModelChange)="arabicName.set($event)"
            dir="auto"
            [placeholder]="translations.arabicName"
          />
        </div>

        <div class="q-field">
          <label class="q-field-label" for="englishName">
            <span class="q-field-icon-badge q-field-icon-badge--sky">
              <i class="bi bi-type"></i>
            </span>
            <span>{{ translations.englishName }}</span>
            <span class="q-field-required">*</span>
          </label>
          <input
            id="englishName"
            name="englishName"
            type="text"
            class="form-control"
            maxlength="100"
            required
            [disabled]="isNamesDisabled || saving"
            [ngModel]="englishName()"
            (ngModelChange)="englishName.set($event)"
            dir="ltr"
            [placeholder]="translations.englishName"
          />
        </div>

        <div class="q-field">
          <label class="q-field-label" for="priority">
            <span class="q-field-icon-badge q-field-icon-badge--amber">
              <i class="bi bi-sort-numeric-up-alt"></i>
            </span>
            <span>{{ translations.priority }}</span>
            <span class="q-field-required">*</span>
          </label>
          <input
            id="priority"
            name="priority"
            type="number"
            min="0"
            step="1"
            class="form-control"
            required
            [disabled]="isPriorityDisabled || saving"
            [ngModel]="priority()"
            (ngModelChange)="priority.set($event)"
            dir="ltr"
            [placeholder]="translations.priority"
          />
          <small class="text-muted mt-1 d-block" style="font-size: 11.5px;">
            <i class="bi bi-info-circle me-1"></i>
            {{ translations.priorityHelpText }}
          </small>
        </div>
      </div>
    </form>
  </div>

  <div modal-footer class="d-flex align-items-center gap-2">
    <button
      type="button"
      class="q-btn q-btn--secondary"
      [disabled]="saving"
      (click)="closeModal()"
    >
      <i class="bi bi-x-lg"></i>
      <span>{{ translations.cancel }}</span>
    </button>
    <button
      type="submit"
      form="segmentForm"
      class="q-btn q-btn--primary"
      [disabled]="saving || isNamesDisabled"
    >
      @if (saving) {
        <span class="spinner-border spinner-border-sm" role="status"></span>
      } @else {
        <i class="bi bi-check2"></i>
      }
      <span>{{ translations.save }}</span>
    </button>
  </div>
</app-modal>
