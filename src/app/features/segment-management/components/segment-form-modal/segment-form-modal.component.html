<app-modal
  [isOpen]="open"
  [title]="modalTitle"
  [size]="'md'"
  icon="bi bi-tag-fill"
  [direction]="direction"
  [loading]="saving"
  [closeLabel]="translations.close"
  (closed)="closeModal()"
>
  <form id="segmentForm" (ngSubmit)="onSubmit()" class="editor-form">
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 border-danger-subtle bg-danger-subtle text-danger rounded-3 py-2 px-3 mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-6 flex-shrink-0"></i>
        <div class="small fw-semibold">{{ errorMessage() }}</div>
      </div>
    }

    @if (isDefaultSegment) {
      <div class="alert alert-warning d-flex align-items-center gap-2 border-warning-subtle bg-warning-subtle text-warning-emphasis mb-3 rounded-3 py-2 px-3">
        <i class="bi bi-shield-lock-fill fs-6 flex-shrink-0 text-warning"></i>
        <small class="fw-semibold">{{ translations.priorityFixedHint }}</small>
      </div>
    }

    <div class="q-dialog-card mb-3">
      <div class="q-dialog-card-header mb-3">
        <span class="q-dialog-card-icon q-dialog-card-icon--teal">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2 2a1 1 0 0 1 1-1h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 2 6.586V2zm3.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
          </svg>
        </span>
        <div>
          <h4 class="q-dialog-card-title">{{ modalTitle }}</h4>
          <p class="q-dialog-card-subtitle">{{ translations.priorityHelpText }}</p>
        </div>
      </div>

      <div class="q-field mb-3">
        <label class="q-field-label" for="arabicName">
          <span class="q-field-icon-badge q-field-icon-badge--teal">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
              <text x="3" y="12" font-size="11" font-weight="bold">ع</text>
            </svg>
          </span>
          <span>{{ translations.arabicName }}</span>
          <span class="q-field-required">*</span>
        </label>
        <input
          id="arabicName"
          name="arabicName"
          type="text"
          class="form-control"
          maxlength="100"
          required
          [disabled]="isNamesDisabled || saving"
          [ngModel]="arabicName()"
          (ngModelChange)="arabicName.set($event)"
          dir="auto"
          [placeholder]="translations.arabicName"
        />
      </div>

      <div class="q-field mb-3">
        <label class="q-field-label" for="englishName">
          <span class="q-field-icon-badge q-field-icon-badge--sky">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
              <text x="2" y="12" font-size="10" font-family="sans-serif" font-weight="bold">En</text>
            </svg>
          </span>
          <span>{{ translations.englishName }}</span>
          <span class="q-field-required">*</span>
        </label>
        <input
          id="englishName"
          name="englishName"
          type="text"
          class="form-control"
          maxlength="100"
          required
          [disabled]="isNamesDisabled || saving"
          [ngModel]="englishName()"
          (ngModelChange)="englishName.set($event)"
          dir="ltr"
          [placeholder]="translations.englishName"
        />
      </div>

      <div class="q-field mb-2">
        <label class="q-field-label" for="priority">
          <span class="q-field-icon-badge q-field-icon-badge--amber">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
              <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
            </svg>
          </span>
          <span>{{ translations.priority }}</span>
          <span class="q-field-required">*</span>
        </label>
        <input
          id="priority"
          name="priority"
          type="number"
          min="0"
          step="1"
          class="form-control"
          required
          [disabled]="isPriorityDisabled || saving"
          [ngModel]="priority()"
          (ngModelChange)="priority.set($event)"
          dir="ltr"
          [placeholder]="translations.priority"
        />
      </div>
    </div>
  </form>

  <div modal-footer class="d-flex align-items-center gap-2">
    <button
      type="button"
      class="q-btn q-btn--secondary"
      [disabled]="saving"
      (click)="closeModal()"
    >
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4L4 12M4 4l8 8"/>
      </svg>
      <span>{{ translations.cancel }}</span>
    </button>
    <button
      type="submit"
      form="segmentForm"
      class="q-btn q-btn--primary"
      [disabled]="saving || isNamesDisabled"
    >
      @if (saving) {
        <div class="spinner-border spinner-border-sm" role="status"></div>
      } @else {
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5l3.5 3.5 7-7"/>
        </svg>
      }
      <span>{{ translations.save }}</span>
    </button>
  </div>
</app-modal>
