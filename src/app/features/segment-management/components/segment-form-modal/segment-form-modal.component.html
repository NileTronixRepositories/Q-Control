@if (open) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" [attr.dir]="'auto'">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content shadow-lg border-0">
        <header class="modal-header editor-panel-header d-flex justify-content-between align-items-center">
          <h5 class="modal-title fw-bold d-flex align-items-center gap-2 m-0 fs-6">
            <!-- Modern Tag SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
            {{ modalTitle }}
          </h5>
          <button
            type="button"
            class="btn-close m-0"
            [attr.aria-label]="translations.close"
            [disabled]="saving"
            (click)="closeModal()"
          ></button>
        </header>

        <form (ngSubmit)="onSubmit()" class="editor-form">
          <div class="modal-body p-4 dialog-content">
            @if (errorMessage()) {
              <div class="alert alert-danger d-flex align-items-center gap-2 border-danger-subtle bg-danger-subtle text-danger rounded-3" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <div class="small fw-semibold">{{ errorMessage() }}</div>
              </div>
            }

            @if (isDefaultSegment) {
              <div class="alert alert-info d-flex align-items-center gap-2 border-info-subtle bg-info-subtle text-info mb-4 rounded-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <small class="fw-semibold">{{ translations.systemDefault }} - Priority is fixed to 0.</small>
              </div>
            }

            <div class="form-cell form-cell-full mb-3">
              <label class="form-field">
                <span>
                  {{ translations.arabicName }} <span class="text-danger">*</span>
                </span>
                <input
                  id="arabicName"
                  name="arabicName"
                  type="text"
                  class="form-control rounded-3"
                  maxlength="100"
                  required
                  [disabled]="isNamesDisabled || saving"
                  [ngModel]="arabicName()"
                  (ngModelChange)="arabicName.set($event)"
                  dir="auto"
                />
              </label>
            </div>

            <div class="form-cell form-cell-full mb-3">
              <label class="form-field">
                <span>
                  {{ translations.englishName }} <span class="text-danger">*</span>
                </span>
                <input
                  id="englishName"
                  name="englishName"
                  type="text"
                  class="form-control rounded-3"
                  maxlength="100"
                  required
                  [disabled]="isNamesDisabled || saving"
                  [ngModel]="englishName()"
                  (ngModelChange)="englishName.set($event)"
                  dir="auto"
                />
              </label>
            </div>

            <div class="form-cell form-cell-full mb-3">
              <label class="form-field">
                <span>
                  {{ translations.priority }} <span class="text-danger">*</span>
                </span>
                <input
                  id="priority"
                  name="priority"
                  type="number"
                  min="0"
                  step="1"
                  class="form-control rounded-3"
                  required
                  [disabled]="isPriorityDisabled || saving"
                  [ngModel]="priority()"
                  (ngModelChange)="priority.set($event)"
                  dir="ltr"
                />
              </label>
            </div>
            <small class="text-muted d-flex align-items-center gap-1 mb-2 px-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              <span>Higher priority number = Higher business priority (e.g. 5 > 3 > 0).</span>
            </small>
          </div>

          <footer class="modal-footer bg-light border-top d-flex gap-2 justify-content-end p-3">
            <button
              type="button"
              class="btn btn-light text-secondary border px-4 py-2 fw-semibold rounded-pill"
              [disabled]="saving"
              (click)="closeModal()"
            >
              {{ translations.cancel }}
            </button>
            <button
              type="submit"
              class="btn btn-primary px-4 py-2 fw-semibold rounded-pill d-flex align-items-center gap-2"
              [disabled]="saving || isNamesDisabled"
            >
              @if (saving) {
                <div class="spinner-border spinner-border-sm" role="status"></div>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              }
              {{ translations.save }}
            </button>
          </footer>
        </form>
      </div>
    </div>
  </div>
}
